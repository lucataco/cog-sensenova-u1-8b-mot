build:
  gpu: true
  cuda: "12.8"
  python_version: "3.11"
  python_packages:
    - "torch==2.8.0"
    - "torchvision==0.23.0"
    - "transformers==4.57.1"
    - "tokenizers==0.22.1"
    - "accelerate==1.10.1"
    - "huggingface-hub==0.36.2"
    - "safetensors==0.6.2"
    - "sentencepiece==0.2.1"
    - "numpy==2.2.0"
    - "pillow==12.0.0"
    - "tqdm==4.67.1"
    - "packaging==25.0"
  run:
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/download/v0.8.2/pget_linux_x86_64" && chmod +x /usr/local/bin/pget
predict: "predict.py:Predictor"
